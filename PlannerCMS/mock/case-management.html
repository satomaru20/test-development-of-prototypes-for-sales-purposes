<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planner CMS - 案件管理</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Yu Gothic UI","Meiryo",sans-serif;
}

body{
    background:#f5f7fb;
    color:#333;
}

header{
    background:#1e3a8a;
    color:white;
    padding:16px 24px;
    font-size:22px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:16px;
}

.tab{
    border:none;
    cursor:pointer;
    border-radius:8px;
    padding:10px 20px;
    background:#dbeafe;
    font-weight:bold;
}

.tab.active{
    background:#2563eb;
    color:white;
}

.search-row{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.status-toolbar{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}

.statusArea{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.statusArea label{
    background:#eef2ff;
    border:1px solid #dbeafe;
    border-radius:6px;
    padding:5px 10px;
}

input[type=text]{
    padding:8px;
    width:260px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:6px;
    padding:8px 14px;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#6b7280;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f8fafc;
    cursor:pointer;
}

tbody tr:hover{
    background:#f9fafb;
}

.badge{
    color:white;
    border-radius:20px;
    padding:4px 10px;
    font-size:12px;
}

.recruit{
    background:#2563eb;
}

.interview{
    background:#f59e0b;
}

.pass{
    background:#10b981;
}

.pending{
    background:#6b7280;
}

.activeProject{
    background:#16a34a;
}

.extend{
    background:#2563eb;
}

.leave{
    background:#dc2626;
}

.pagination{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:16px;
}

.detail{
    display:none;
}

.detail.show{
    display:block;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.label{
    color:#666;
    font-size:12px;
}

.value{
    font-weight:bold;
    margin-top:4px;
}

@media(max-width:768px){

    .search-row{
        flex-direction:column;
        align-items:stretch;
    }

    .status-toolbar{
        flex-wrap:wrap;
    }

    input[type=text]{
        width:100%;
    }
}

</style>
</head>

<body>

<header>
Planner CMS - 募集案件 / 参画案件管理
</header>

<div class="container">

<div class="tabs">
    <button class="tab active" id="recruitTab">募集案件管理</button>
    <button class="tab" id="assignTab">参画案件管理</button>
</div>

<div class="card">

    <!-- 検索行 -->
    <div class="search-row">
        <input
            type="text"
            id="keyword"
            placeholder="案件名・作業者検索">

        <button
            class="primary"
            onclick="render()">
            検索
        </button>

        <button
            class="secondary"
            onclick="resetFilters()">
            条件リセット
        </button>
    </div>

    <!-- ボタン行 -->
    <div
        class="status-toolbar"
        id="statusToolbar">

        <button
            class="secondary"
            onclick="checkAll()">
            全選択
        </button>

        <button
            class="secondary"
            onclick="uncheckAll()">
            全解除
        </button>

    </div>

    <!-- ステータス -->
    <div
        class="statusArea"
        id="statusArea">
    </div>

</div>

<div class="card">

<table>

<thead>
<tr id="thead"></tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<div class="pagination">

    <button
        class="secondary"
        onclick="prevPage()">
        前へ
    </button>

    <span id="pageInfo"></span>

    <button
        class="secondary"
        onclick="nextPage()">
        次へ
    </button>

</div>

</div>

<div
    class="card detail"
    id="detailCard">

    <h2>案件詳細</h2>

    <br>

    <div
        id="detailGrid"
        class="detail-grid">
    </div>

</div>

</div>

<script>

let currentTab="recruit";
let page=1;
const pageSize=10;

let sortColumn="";
let sortAsc=true;

const recruitStatuses=[
"展開前",
"募集",
"本人確認中",
"提案中",
"面談",
"合否",
"保留",
"見送り"
];

const recruitData=[

{
id:"R001",
name:"金融システム刷新",
status:"提案中",
priority:"高",
location:"東京"
},
{
id:"R002",
name:"生成AI開発",
status:"面談",
priority:"高",
location:"フルリモート"
},
{
id:"R003",
name:"クラウド移行案件",
status:"募集",
priority:"中",
location:"札幌"
},
{
id:"R004",
name:"自治体DX",
status:"本人確認中",
priority:"低",
location:"仙台"
}

];

const assignData=[

{
id:"A001",
name:"ECサイト開発",
worker:"山田太郎",
status:"参画中",
startDate:"2025-12-01",
endDate:"2027-03-31"
},
{
id:"A002",
name:"自治体DX",
worker:"佐藤花子",
status:"延長確認",
startDate:"2025-08-01",
endDate:"2026-12-31"
},
{
id:"A003",
name:"基幹刷新",
worker:"田中一郎",
status:"退場予定",
startDate:"2025-01-01",
endDate:"2026-11-30"
}

];

function calcDuration(startDate){

    const start=new Date(startDate);
    const now=new Date();

    let months=
        (now.getFullYear()-start.getFullYear())*12
        +(now.getMonth()-start.getMonth());

    if(months<0){
        months=0;
    }

    return months+"ヶ月";
}

function createStatusFilter(){

    const area=document.getElementById("statusArea");
    const toolbar=document.getElementById("statusToolbar");

    if(currentTab!=="recruit"){

        area.innerHTML="";
        toolbar.style.display="none";

        return;
    }

    toolbar.style.display="flex";

    const saved=
        JSON.parse(
            localStorage.getItem(
                "planner.recruit.statuses"
            ) || "null"
        );

    area.innerHTML="";

    recruitStatuses.forEach(status=>{

        const checked=
            saved
            ? saved.includes(status)
            : true;

        area.innerHTML+=`
        <label>
          <input
             type="checkbox"
             class="statusChk"
             value="${status}"
             ${checked ? "checked" : ""}>
          ${status}
        </label>
        `;

    });

    document
        .querySelectorAll(".statusChk")
        .forEach(chk=>{

            chk.addEventListener(
                "change",
                ()=>{
                    saveStatus();
                    render();
                }
            );
        });
}

function saveStatus(){

    const values=
        [...document.querySelectorAll(".statusChk:checked")]
        .map(x=>x.value);

    localStorage.setItem(
        "planner.recruit.statuses",
        JSON.stringify(values)
    );
}

function checkAll(){

    document
        .querySelectorAll(".statusChk")
        .forEach(x=>x.checked=true);

    saveStatus();
    render();
}

function uncheckAll(){

    document
        .querySelectorAll(".statusChk")
        .forEach(x=>x.checked=false);

    saveStatus();
    render();
}

function resetFilters(){

    document
        .getElementById("keyword")
        .value="";

    checkAll();
}

function getRows(){

    let rows=[];

    if(currentTab==="recruit"){

        const selected=
            [...document.querySelectorAll(".statusChk:checked")]
            .map(x=>x.value);

        rows=
            recruitData.filter(
                x=>selected.includes(x.status)
            );

    }else{

        rows=assignData.map(x=>({
            ...x,
            duration:
                calcDuration(x.startDate)
        }));
    }

    const keyword=
        document
            .getElementById("keyword")
            .value
            .toLowerCase();

    return rows.filter(
        x=>
            JSON.stringify(x)
            .toLowerCase()
            .includes(keyword)
    );
}

function render(){

    const headers=
        currentTab==="recruit"
        ? ["id","name","status","priority","location"]
        : ["id","name","worker","status","duration","endDate"];

    thead.innerHTML="";

    headers.forEach(h=>{

        const th=document.createElement("th");

        th.textContent=h;

        th.onclick=()=>{

            if(sortColumn===h){
                sortAsc=!sortAsc;
            }else{
                sortColumn=h;
                sortAsc=true;
            }

            render();
        };

        thead.appendChild(th);

    });

    let rows=getRows();

    if(sortColumn){

        rows.sort((a,b)=>{

            const aa=a[sortColumn]||"";
            const bb=b[sortColumn]||"";

            return sortAsc
                ? String(aa).localeCompare(String(bb))
                : String(bb).localeCompare(String(aa));

        });

    }

    tbody.innerHTML="";

    const pageRows=
        rows.slice(
            (page-1)*pageSize,
            page*pageSize
        );

    pageRows.forEach(row=>{

        const tr=document.createElement("tr");

        tr.onclick=()=>showDetail(row);

        headers.forEach(h=>{

            const td=document.createElement("td");

            if(h==="status"){

                let cls="badge ";

                if(currentTab==="recruit"){

                    if(row.status==="募集") cls+="recruit";
                    else if(row.status==="面談") cls+="interview";
                    else if(row.status==="提案中") cls+="pass";
                    else cls+="pending";

                }else{

                    if(row.status==="参画中") cls+="activeProject";
                    else if(row.status==="延長確認") cls+="extend";
                    else cls+="leave";
                }

                td.innerHTML=
                `<span class="${cls}">
                    ${row.status}
                </span>`;

            }else{
                td.textContent=row[h];
            }

            tr.appendChild(td);

        });

        tbody.appendChild(tr);
    });

    pageInfo.textContent=
        `${page} / ${
           Math.max(
             1,
             Math.ceil(rows.length/pageSize)
           )
        }`;
}

function showDetail(row){

    detailCard.classList.add("show");

    let html="";

    for(let key in row){

        html+=`
        <div>
            <div class="label">${key}</div>
            <div class="value">${row[key]}</div>
        </div>
        `;
    }

    detailGrid.innerHTML=html;
}

function nextPage(){

    const max=
        Math.ceil(
            getRows().length/pageSize
        );

    if(page<max){
        page++;
        render();
    }
}

function prevPage(){

    if(page>1){
        page--;
        render();
    }
}

recruitTab.onclick=()=>{

    currentTab="recruit";

    recruitTab.classList.add("active");
    assignTab.classList.remove("active");

    page=1;

    createStatusFilter();
    render();
};

assignTab.onclick=()=>{

    currentTab="assign";

    assignTab.classList.add("active");
    recruitTab.classList.remove("active");

    page=1;

    createStatusFilter();
    render();
};

createStatusFilter();
render();

</script>

</body>
</html>
