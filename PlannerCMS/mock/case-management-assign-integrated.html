<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planner CMS - 案件管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#253047;font-family:"Yu Gothic UI","Meiryo",sans-serif}button,input,textarea{font:inherit}
header{background:#1e3a8a;color:#fff;padding:17px 24px;font-size:21px;font-weight:bold}.container{max-width:1260px;margin:auto;padding:22px}.card{background:white;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.tabs,.search-row,.status-toolbar,.statusArea,.toolbar,.left-buttons,.right-buttons,.pagination{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tabs{margin-bottom:16px}.search-row,.status-toolbar{margin-bottom:12px}.statusArea label{background:#eef2ff;border:1px solid #dbeafe;border-radius:6px;padding:6px 10px;cursor:pointer}button{border:0;border-radius:7px;padding:9px 15px;cursor:pointer;font-weight:600}button:hover{filter:brightness(.95)}button:disabled{opacity:.45;cursor:not-allowed}.primary,.tab.active,.edit-btn{background:#2563eb;color:#fff}.secondary,.back-btn{background:#6b7280;color:#fff}.chat-btn{background:#10b981;color:#fff}.tab{background:#dbeafe}.search-row input{padding:9px;border:1px solid #cbd5e1;border-radius:6px;width:270px;max-width:100%}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5e7eb;white-space:nowrap}th{background:#f8fafc;cursor:pointer;user-select:none}tbody tr{cursor:pointer}tbody tr:hover{background:#eff6ff}tbody tr:focus{outline:2px solid #2563eb;outline-offset:-2px}.badge{display:inline-block;background:#64748b;color:#fff;border-radius:20px;padding:4px 10px;font-size:12px}.badge.recruit,.badge.extend{background:#2563eb}.badge.interview{background:#f59e0b}.badge.pass,.badge.activeProject{background:#16a34a}.badge.leave{background:#dc2626}.pagination{justify-content:center;margin-top:16px}.toolbar{justify-content:space-between;align-items:flex-start;margin-bottom:20px}.details-title{margin:0 0 16px;font-size:22px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.detail-item{background:#f8fafc;padding:15px;border-radius:8px;min-width:0}.detail-item.full{grid-column:1/-1}.detail-label{color:#64748b;font-size:12px;margin-bottom:6px}.detail-value{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.priority-high{color:#dc2626}.memo{border:1px solid #dbe2ea;background:#fff;padding:14px;min-height:110px;border-radius:8px}.hint{color:#64748b;font-size:13px;margin-top:12px}.empty{text-align:center;color:#64748b;padding:30px}textarea,.detail-input{display:block;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px;background:white;min-height:40px}.detail-input:focus,textarea:focus{outline:2px solid #93c5fd}.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;background:#1e293b;color:white;border-radius:9px;box-shadow:0 4px 20px #0002;z-index:20}#chatPanel{margin-top:16px;padding:16px;background:#f0fdf4;border-radius:8px}#chatPanel textarea{margin:10px 0}#chatHistory{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}#listView[hidden],#detailView[hidden],#chatPanel[hidden]{display:none!important}
@media(max-width:768px){.container{padding:12px}.card{padding:14px}.detail-grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.left-buttons,.right-buttons{width:100%}.search-row input{width:100%}header{font-size:18px}.right-buttons button{flex:1}}
/* 参画詳細専用 */
.assign-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 20px}.assign-kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;text-align:center;box-shadow:0 2px 8px #00000009}.assign-kpi strong{display:block;font-size:13px;color:#64748b;margin-bottom:9px}.assign-kpi span{font-size:21px;font-weight:800;color:#1e3a8a}.assign-section{border:1px solid #e2e8f0;padding:18px;border-radius:10px;margin:16px 0}.assign-section h2{font-size:18px;margin:0 0 16px}.assign-section .detail-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.doc-panel{background:#eff6ff;padding:15px;border-radius:8px;margin-top:16px}.doc-panel input{max-width:100%}[hidden]{display:none!important}@media(max-width:768px){.assign-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.assign-kpi{padding:12px}.assign-kpi span{font-size:17px}}
</style>
</head>
<body>
<header id="pageHeading">Planner CMS - 募集案件 / 参画案件管理</header>
<main class="container">
<section id="listView">
  <div class="tabs" role="tablist" aria-label="案件種別">
    <button type="button" class="tab active" id="recruitTab" role="tab" aria-selected="true">募集案件管理</button>
    <button type="button" class="tab" id="assignTab" role="tab" aria-selected="false">参画案件管理</button><button type="button" class="primary" id="registerCaseBtn" style="margin-left:auto">＋ 募集案件を新規登録</button>
  </div>
  <div class="card">
    <div class="search-row"><input type="text" id="keyword" placeholder="案件名・作業者検索" aria-label="検索キーワード"><button type="button" class="primary" id="searchBtn">検索</button><button type="button" class="secondary" id="resetBtn">条件リセット</button></div>
    <div class="status-toolbar" id="statusToolbar"><button type="button" class="secondary" id="checkAllBtn">全選択</button><button type="button" class="secondary" id="uncheckAllBtn">全解除</button></div>
    <div class="statusArea" id="statusArea" aria-label="募集ステータス絞り込み"></div>
  </div>
  <div id="assignListKpis" class="assign-kpis" hidden></div>
  <div class="card"><div class="table-wrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div><div class="pagination"><button type="button" class="secondary" id="prevBtn">前へ</button><span id="pageInfo"></span><button type="button" class="secondary" id="nextBtn">次へ</button></div><p class="hint">行をクリックすると案件の詳細を表示します。</p></div>
</section>
<section id="detailView" hidden>
  <div class="card"><div class="toolbar"><div class="left-buttons"><button type="button" id="backBtn" class="back-btn">一覧へ戻る</button></div><div class="right-buttons"><button type="button" id="chatBtn" class="chat-btn">チャット</button><button type="button" id="docBtn" class="primary" hidden>書類提出</button><button type="button" id="editBtn" class="edit-btn">編集</button><button type="button" id="saveBtn" class="primary" hidden>保存</button><button type="button" id="cancelBtn" class="secondary" hidden>キャンセル</button></div></div>
  <h1 class="details-title" id="detailTitle">案件詳細</h1>
  <div id="assignDetailKpis" class="assign-kpis" hidden></div><p id="assignKpiHint" class="hint" hidden>契約残日数・継続期間は現在の日付と一覧データの契約開始日・終了日から計算しています。</p>
  <div id="assignDetailSections" hidden>
    <section class="assign-section"><h2>契約ユーザー情報</h2><div id="assignUserGrid" class="detail-grid"></div></section>
    <section class="assign-section"><h2>契約条件詳細</h2><div id="assignContractGrid" class="detail-grid"></div></section>
  </div>
  <div id="detailGrid" class="detail-grid"></div>
  <div id="documentPanel" class="doc-panel" hidden><strong>書類提出（デモ）</strong><p class="hint">ファイルの送信・アップロードは行いません。選択したファイル名のみ表示します。</p><input id="docFile" type="file" aria-label="書類ファイル選択"><p id="docStatus" class="hint"></p></div>
  <div id="chatPanel" hidden><strong>案件内メモ（ローカルデモ）</strong><p class="hint">外部へのメッセージ送信機能はありません。このブラウザ内だけに保存されます。</p><div id="chatHistory"></div><textarea id="chatText" rows="3" placeholder="メモを入力"></textarea><button type="button" class="chat-btn" id="chatAddBtn">メモを追加</button></div>
  </div>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const navParams=new URLSearchParams(window.location.search);
const fromMembers=navParams.get('from')==='member-management';
const linkedProjectId=navParams.get('projectId');
const memberPage='member-management.html';
const recruitStatuses=['展開前','募集','本人確認中','提案中','面談','合否','保留','見送り'];
const recruitData=[
{id:'R001',name:'金融システム刷新',status:'提案中',priority:'高',location:'東京'},
{id:'R002',name:'生成AI開発',status:'面談',priority:'高',location:'フルリモート'},
{id:'R003',name:'クラウド移行案件',status:'募集',priority:'中',location:'札幌'},
{id:'R004',name:'自治体DX',status:'本人確認中',priority:'低',location:'仙台'}
];
const assignData=[
{id:'A001',name:'ECサイト開発',worker:'山田太郎',status:'参画中',extensionPreference:'希望',startDate:'2025-12-01',endDate:'2027-03-31'},
{id:'A002',name:'自治体DX',worker:'佐藤花子',status:'延長確認',extensionPreference:'未登録',startDate:'2025-08-01',endDate:'2026-12-31'},
{id:'A003',name:'基幹刷新',worker:'田中一郎',status:'退場予定',extensionPreference:'未登録',startDate:'2025-01-01',endDate:'2026-11-30'}
];
const details={
 R003:{work:'クラウド移行案件',description:'クラウド移行案件\nReact、TypeScript、Azure環境を利用したアジャイル開発。',requiredSkills:'React、TypeScript、Azure、クラウド移行案件',preferredSkills:'AWS、GraphQL、CI/CDパイプライン構築経験',contract:'準委任',location:'札幌(ハイブリッド)',settlement:'140h ～ 180h',unitPrice:'750,000円',businessFlow:'元請 → 自社',memo:'AWS経験者優先。\nReact経験2年以上推奨。\n延長可能性あり。'},
 R004:{work:'自治体DX',description:'自治体DX\nReact、TypeScript、Azure環境を利用したアジャイル開発。',requiredSkills:'React、TypeScript、Azure、自治体DX',preferredSkills:'AWS、GraphQL、CI/CDパイプライン構築経験',contract:'準委任',location:'仙台',settlement:'140h ～ 180h',unitPrice:'750,000円',businessFlow:'元請 → 自社',memo:'AWS経験者優先。\nReact経験2年以上推奨。\n延長可能性あり。'},
};
const assignTemplate={
 A001:{group:'DX推進G',proposal:'増員希望あり',situation:'遅刻なし・連絡済',health:'★★★★★',motivation:'★★★★☆',siteStatus:'良好',extensionIntent:'延長希望',continuationProspect:'高',contractPeriod:'2026/01-2027/03',location:'東京',contractType:'準委任',contractPrice:'800,000円',settlementHours:'140-180h',workingHours:'9:00-18:00(休憩:12:00-13:00)',workStyle:'ハイブリッド',holidays:'土日祝',paymentTerms:'40日',transportation:'実費支給',memo:'AWS経験歓迎',description:'ECサイト刷新PJ',siteRating:'良好',extensionPreference:'希望'}
};
Object.keys(assignTemplate).forEach(id=>{details[id]={...assignTemplate[id],...(details[id]||{})};});
const localKey='planner.case.details.v1';
try{const savedDetails=JSON.parse(localStorage.getItem(localKey)||'{}');for(const [id,entry] of Object.entries(savedDetails)){details[id]={...(details[id]||{}),...entry};}}catch(e){console.warn('保存済み詳細を読み込めません',e)}
let currentTab='recruit',page=1,sortColumn='',sortAsc=true,selectedId=null,editing=false;
const pageSize=10;
const fields=[
['id','案件ID'],['name','案件名'],['work','作業内容'],['status','ステータス'],['priority','優先度'],['proposer','増員提案者'],['worker','作業者'],['description','案件詳細','full'],['requiredSkills','必須スキル'],['preferredSkills','尚可スキル'],['contract','契約方法'],['location','勤務地'],['period','作業期間'],['settlement','精算時間（精算幅）'],['unitPrice','単価'],['businessFlow','商流'],['startDate','参画開始日'],['endDate','参画終了日'],['duration','参画期間'],['memo','備考','full']
];
const assignUserFields=[['group','所属グループ情報'],['worker','作業者名'],['proposal','提案有無'],['situation','状況'],['health','健康状態'],['motivation','モチベーション'],['siteStatus','現場状況'],['extensionIntent','現場延長の意向']];
const assignContractFields=[['id','案件ID'],['name','案件名'],['contractPeriod','契約期間'],['continuationProspect','継続見込み'],['location','勤務地'],['contractType','契約形態'],['contractPrice','契約単価'],['settlementHours','精算時間'],['workingHours','就業時間'],['workStyle','就業場所'],['holidays','休日休暇'],['paymentTerms','支払いサイト'],['transportation','交通費'],['memo','備考'],['description','案件詳細']];
const toStatusClass=s=>({'募集':'recruit','面談':'interview','提案中':'pass','参画中':'activeProject','延長確認':'extend','退場予定':'leave'})[s]||'';
const calcDuration=startDate=>{if(!startDate)return '未登録';const d=new Date(startDate+'T00:00:00'),now=new Date();if(Number.isNaN(d.getTime()))return '未登録';return Math.max(0,(now.getFullYear()-d.getFullYear())*12+now.getMonth()-d.getMonth()-(now.getDate()<d.getDate()?1:0))+'ヶ月';};
function getRow(id){return [...recruitData,...assignData].find(x=>x.id===id);}
function calcRemaining(endDate){if(!/^\d{4}-\d{2}-\d{2}$/.test(endDate||''))return '未登録';const d=new Date(endDate+'T00:00:00');if(Number.isNaN(d.getTime()))return '未登録';const today=new Date();today.setHours(0,0,0,0);return Math.max(0,Math.round((d-today)/86400000))+'日';}
function createKpi(label,value){const box=document.createElement('div');box.className='assign-kpi';const b=document.createElement('strong');b.textContent=label;const v=document.createElement('span');v.textContent=String(value);box.append(b,v);return box;}
function renderListKpis(){const el=$('assignListKpis');el.hidden=currentTab!=='assign';el.replaceChildren();if(currentTab==='assign'){['参画中','延長確認','退場予定','契約終了'].forEach(status=>el.append(createKpi(status,assignData.filter(x=>x.status===status).length+'名')));}}
function makeDetailItem(row,key,label,editable=true){const item=document.createElement('div');item.className='detail-item';const l=document.createElement('div');l.className='detail-label';l.textContent=label;const v=document.createElement('div');v.className='detail-value';if(editing&&editable){const input=document.createElement(['memo','description'].includes(key)?'textarea':'input');if(input.tagName==='INPUT')input.type='text';else input.rows=3;input.className='detail-input';input.dataset.field=key;input.value=row[key]??'';v.append(input);}else if(key==='status'){const badge=document.createElement('span');badge.className='badge '+toStatusClass(row.status);badge.textContent=row.status||'未登録';v.append(badge);}else v.textContent=row[key]||'未登録';item.append(l,v);return item;}
function renderAssignDetail(row){$('assignDetailKpis').hidden=false;$('assignKpiHint').hidden=false;$('assignDetailSections').hidden=false;$('detailGrid').hidden=true;$('docBtn').hidden=false;const kpis=$('assignDetailKpis');kpis.replaceChildren();[['契約残日数',calcRemaining(row.endDate)],['継続期間',row.duration||'未登録'],['現場評価',row.siteRating||row.siteStatus||'未登録'],['延長意向',row.extensionPreference||row.extensionIntent||'未登録']].forEach(([k,v])=>kpis.append(createKpi(k,v)));for(const [gridId,fs] of [['assignUserGrid',assignUserFields],['assignContractGrid',assignContractFields]]){const grid=$(gridId);grid.replaceChildren();fs.forEach(([key,label])=>grid.append(makeDetailItem(row,key,label,key!=='id')));}}
function mergedRow(row){const r={...row,...(details[row.id]||{})};if(r.startDate)r.duration=calcDuration(r.startDate);if(r.startDate&&r.endDate&&!r.period)r.period=r.startDate.replaceAll('-','/')+' ～ '+r.endDate.replaceAll('-','/');return r;}
function createStatusFilter(){const area=$('statusArea');area.replaceChildren();$('statusToolbar').hidden=currentTab!=='recruit';if(currentTab!=='recruit')return;let saved=null;try{saved=JSON.parse(localStorage.getItem('planner.recruit.statuses')||'null');}catch(e){}recruitStatuses.forEach(status=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.className='statusChk';input.value=status;input.checked=Array.isArray(saved)?saved.includes(status):true;input.addEventListener('change',()=>{saveStatus();page=1;render();});label.append(input,document.createTextNode(' '+status));area.append(label);});}
function saveStatus(){try{localStorage.setItem('planner.recruit.statuses',JSON.stringify([...document.querySelectorAll('.statusChk:checked')].map(x=>x.value)));}catch(e){console.warn(e)}}
function checkAll(checked){document.querySelectorAll('.statusChk').forEach(x=>x.checked=checked);saveStatus();page=1;render();}
function resetFilters(){$('keyword').value='';if(currentTab==='recruit')checkAll(true);else{page=1;render();}}
function getRows(){let rows=currentTab==='recruit'?recruitData.filter(x=>[...document.querySelectorAll('.statusChk:checked')].some(y=>y.value===x.status)):assignData;const kw=$('keyword').value.trim().toLocaleLowerCase('ja');return rows.map(mergedRow).filter(x=>Object.values(x).some(y=>String(y??'').toLocaleLowerCase('ja').includes(kw)));}
function render(){renderListKpis();const heads=currentTab==='recruit'?[['id','案件ID'],['name','案件名'],['status','ステータス'],['priority','優先度'],['location','勤務地']]:[['id','案件ID'],['name','案件名'],['worker','作業者'],['status','ステータス'],['duration','参画期間'],['extensionPreference','延長意向']];$('thead').replaceChildren();heads.forEach(([key,label])=>{const th=document.createElement('th');th.textContent=label+(sortColumn===key?(sortAsc?' ▲':' ▼'):'');th.tabIndex=0;th.addEventListener('click',()=>{sortAsc=sortColumn===key?!sortAsc:true;sortColumn=key;page=1;render();});th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();th.click();}});$('thead').append(th);});let rows=getRows();if(sortColumn)rows.sort((a,b)=>{const c=String(a[sortColumn]??'').localeCompare(String(b[sortColumn]??''),'ja',{numeric:true});return sortAsc?c:-c;});const max=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,max);$('tbody').replaceChildren();rows.slice((page-1)*pageSize,page*pageSize).forEach(row=>{const tr=document.createElement('tr');tr.tabIndex=0;tr.setAttribute('aria-label',row.name+'の詳細を開く');tr.addEventListener('click',()=>openDetail(row.id));tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(row.id);}});heads.forEach(([key])=>{const td=document.createElement('td');if(key==='status'){const s=document.createElement('span');s.className='badge '+toStatusClass(row.status);s.textContent=row.status;td.append(s);}else td.textContent=row[key]??'—';tr.append(td);});$('tbody').append(tr);});if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=heads.length;td.className='empty';td.textContent='該当する案件がありません';tr.append(td);$('tbody').append(tr);}$('pageInfo').textContent=`${page} / ${max} （${rows.length}件）`;$('prevBtn').disabled=page<=1;$('nextBtn').disabled=page>=max;}
function setTab(tab){currentTab=tab;page=1;sortColumn='';$('recruitTab').classList.toggle('active',tab==='recruit');$('assignTab').classList.toggle('active',tab==='assign');$('recruitTab').setAttribute('aria-selected',String(tab==='recruit'));$('assignTab').setAttribute('aria-selected',String(tab==='assign'));createStatusFilter();render();}
function openDetail(id){if(!getRow(id))return;selectedId=id;editing=false;$('listView').hidden=true;$('detailView').hidden=false;$('chatPanel').hidden=true;$('documentPanel').hidden=true;$('docFile').value='';$('docStatus').textContent='';$('pageHeading').textContent='Planner CMS - '+(currentTab==='recruit'?'募集案件管理':'参画案件管理')+' / 案件詳細';renderDetail();window.scrollTo(0,0);}
function backToList(){if(fromMembers){window.location.assign(new URL(memberPage,window.location.href).href);return;}selectedId=null;editing=false;$('detailView').hidden=true;$('listView').hidden=false;$('pageHeading').textContent='Planner CMS - 募集案件 / 参画案件管理';render();window.scrollTo(0,0);}
function visibleFields(row){return fields.filter(([key])=>currentTab==='assign'||!['worker','startDate','endDate','duration'].includes(key)).filter(([key])=>currentTab==='recruit'||key!=='proposer');}
function renderDetail(){if(!selectedId)return;const row=mergedRow(getRow(selectedId));$('detailTitle').textContent=(currentTab==='assign'?'参画案件詳細：':'案件詳細：')+row.name;$('editBtn').hidden=editing;$('saveBtn').hidden=!editing;$('cancelBtn').hidden=!editing;$('detailGrid').replaceChildren();if(currentTab==='assign'){renderAssignDetail(row);renderChat();return;}$('assignDetailKpis').hidden=true;$('assignKpiHint').hidden=true;$('assignDetailSections').hidden=true;$('detailGrid').hidden=false;$('docBtn').hidden=true;visibleFields(row).forEach(([key,label,span])=>{const item=document.createElement('div');item.className='detail-item'+(span?' full':'');const l=document.createElement('div');l.className='detail-label';l.textContent=label;const v=document.createElement('div');v.className='detail-value';if(editing&&!['id','duration','period'].includes(key)){const input=document.createElement(['description','memo'].includes(key)?'textarea':'input');if(input.tagName==='INPUT')input.type='text';else input.rows=4;input.className='detail-input';input.dataset.field=key;input.value=row[key]??'';v.append(input);}else if(key==='status'){const s=document.createElement('span');s.className='badge '+toStatusClass(row.status);s.textContent=row.status||'未登録';v.append(s);}else{v.textContent=row[key]||'未登録';if(key==='priority'&&row[key]==='高')v.classList.add('priority-high');if(key==='memo')v.classList.add('memo');}item.append(l,v);$('detailGrid').append(item);});renderChat();}
function saveDetail(){const original=getRow(selectedId);if(!original)return;const changes={...(details[selectedId]||{})};document.querySelectorAll('#detailGrid [data-field],#assignDetailSections [data-field]').forEach(el=>{const key=el.dataset.field,value=el.value.trim();if(['name','status','priority','location','worker','startDate','endDate'].includes(key)&&Object.prototype.hasOwnProperty.call(original,key)){original[key]=value;}else changes[key]=value;});details[selectedId]=changes;try{localStorage.setItem(localKey,JSON.stringify(details));localStorage.setItem('planner.case.base.v1',JSON.stringify({recruitData,assignData}));}catch(e){alert('ブラウザへの保存に失敗しました。ストレージ設定を確認してください。');return;}try{const registered=JSON.parse(localStorage.getItem('planner.case.registered.v1')||'[]');if(Array.isArray(registered)){const ix=registered.findIndex(x=>x.id===selectedId);if(ix>=0){registered[ix]={...original,...changes};localStorage.setItem('planner.case.registered.v1',JSON.stringify(registered));}}}catch(e){console.warn('登録案件データへの反映失敗',e)}editing=false;renderDetail();alert('変更内容をこのブラウザに保存しました。');}
function renderChat(){if(!selectedId)return;let list=[];try{list=JSON.parse(localStorage.getItem('planner.case.memo.'+selectedId)||'[]');}catch(e){}$('chatHistory').replaceChildren();list.forEach(x=>{const p=document.createElement('p');p.textContent=x;$('chatHistory').append(p);});if(!list.length)$('chatHistory').textContent='メモはまだありません。';}
$('recruitTab').addEventListener('click',()=>setTab('recruit'));
$('assignTab').addEventListener('click',()=>setTab('assign'));
$('searchBtn').addEventListener('click',()=>{page=1;render();});
$('keyword').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;render();}});
$('resetBtn').addEventListener('click',resetFilters);
$('checkAllBtn').addEventListener('click',()=>checkAll(true));
$('uncheckAllBtn').addEventListener('click',()=>checkAll(false));
$('prevBtn').addEventListener('click',()=>{if(page>1){page--;render();}});
$('nextBtn').addEventListener('click',()=>{page++;render();});
$('backBtn').addEventListener('click',backToList);
$('editBtn').addEventListener('click',()=>{editing=true;renderDetail();});
$('cancelBtn').addEventListener('click',()=>{editing=false;renderDetail();});
$('saveBtn').addEventListener('click',saveDetail);
$('docBtn').addEventListener('click',()=>{$('documentPanel').hidden=!$('documentPanel').hidden;});
$('docFile').addEventListener('change',()=>{$('docStatus').textContent=$('docFile').files.length?'選択中：'+$('docFile').files[0].name+'（未送信）':'';});
$('chatBtn').addEventListener('click',()=>{$('chatPanel').hidden=!$('chatPanel').hidden;});
$('chatAddBtn').addEventListener('click',()=>{const value=$('chatText').value.trim();if(!value)return;const key='planner.case.memo.'+selectedId;let list=[];try{list=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){}list.push(new Date().toLocaleString('ja-JP')+'  '+value);try{localStorage.setItem(key,JSON.stringify(list));$('chatText').value='';renderChat();}catch(e){alert('メモを保存できませんでした。');}});
try{const saved=JSON.parse(localStorage.getItem('planner.case.base.v1')||'null');if(saved?.recruitData?.length&&saved?.assignData?.length){saved.recruitData.forEach(x=>{const o=getRow(x.id);if(o)Object.assign(o,x);});saved.assignData.forEach(x=>{const o=getRow(x.id);if(o)Object.assign(o,x);});}}catch(e){console.warn('案件の保存値を読み込めません',e)}
// 新規登録画面と共有する募集案件データを読み込みます。
const registeredKey='planner.case.registered.v1';
function syncRegisteredCases(){
  try{
    const items=JSON.parse(localStorage.getItem(registeredKey)||'[]');
    if(!Array.isArray(items))return;
    items.forEach(entry=>{
      if(!entry||typeof entry.id!=='string'||!entry.id.startsWith('R'))return;
      const existing=getRow(entry.id);
      if(existing&&recruitData.includes(existing))Object.assign(existing,entry);
      else if(!existing)recruitData.push(entry);
    });
  }catch(e){console.warn('新規登録案件を読み込めません',e)}
}
syncRegisteredCases();
$('registerCaseBtn').addEventListener('click',()=>window.location.assign(new URL('case-registration.html',window.location.href).href));
// 登録画面から戻ったときは登録した案件の詳細を表示します。
const createdId=navParams.get('createdId');
setTab(navParams.get('tab')==='assign'?'assign':'recruit');
if(createdId&&recruitData.some(x=>x.id===createdId))openDetail(createdId);
if(fromMembers){
  const match=linkedProjectId&&getRow(linkedProjectId);
  if(match){
    setTab(assignData.some(x=>x.id===linkedProjectId)?'assign':'recruit');
    openDetail(linkedProjectId);
  }else{
    setTab('assign');
    const back=document.createElement('button');back.type='button';back.className='back-btn';back.textContent='所属ユーザー管理に戻る';back.addEventListener('click',()=>window.location.assign(new URL(memberPage,window.location.href).href));
    const note=document.createElement('div');note.className='card';note.setAttribute('role','alert');note.style.borderLeft='4px solid #d97706';
    const msg=document.createElement('p');msg.textContent='指定された案件ID「'+(linkedProjectId||'未指定')+'」は案件管理の一覧に存在しません。所属ユーザー管理の参画先案件IDを確認してください。';
    note.append(msg,back);$('listView').prepend(note);
  }
}
</script>
