<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KPIダッシュボード</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Yu Gothic","Segoe UI",sans-serif;
    background:#f4f7fb;
    color:#333;
}

.header{
    background:#1f4e79;
    color:white;
    padding:20px 30px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin-top:8px;
    opacity:0.8;
}

.container{
    padding:20px;
}

.kpi-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.kpi-card{

    background:white;

    border-radius:12px;

    padding:20px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.08);

    transition:.2s;
}

.kpi-card:hover{

    transform:translateY(-2px);

    box-shadow:
        0 6px 16px rgba(0,0,0,.12);
}

.kpi-title{
    font-size:14px;
    color:#666;
}

.kpi-value{

    font-size:42px;

    font-weight:bold;

    margin-top:12px;
}

.kpi-footer{

    margin-top:15px;

    display:flex;

    justify-content:space-between;
}

.trend-up{
    color:#198754;
    font-weight:bold;
}

.trend-down{
    color:#dc3545;
    font-weight:bold;
}

.blue{
    border-left:6px solid #1f4e79;
}

.green{
    border-left:6px solid #198754;
}

.orange{
    border-left:6px solid #fd7e14;
}

.red{
    border-left:6px solid #dc3545;
}

.section{

    margin-top:30px;

    background:white;

    border-radius:12px;

    padding:20px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.08);
}

.section h2{
    margin-top:0;
}

.alert{

    background:#fff4ce;

    border:1px solid #ffd966;

    border-radius:8px;

    padding:15px;

    margin-bottom:10px;
}

.alert-high{

    background:#ffe5e5;

    border:1px solid #ff9999;
}

table{

    width:100%;

    border-collapse:collapse;
}

th,td{

    padding:12px;

    border-bottom:1px solid #eee;

    text-align:left;
}

th{
    background:#f8f9fa;
}

</style>

</head>
<body>

<div class="header">

    <h1>
        人材マッチング管理システム
    </h1>

    <p>
        KPIダッシュボード
    </p>

</div>

<div class="container">

    <div class="kpi-grid">

        <div class="kpi-card blue">

            <div class="kpi-title">
                未決定求職者
            </div>

            <div class="kpi-value">
                125
            </div>

            <div class="kpi-footer">

                <span>
                    前日比
                </span>

                <span class="trend-up">
                    +12
                </span>

            </div>

        </div>

        <div class="kpi-card green">

            <div class="kpi-title">
                募集中案件
            </div>

            <div class="kpi-value">
                45
            </div>

            <div class="kpi-footer">

                <span>
                    前日比
                </span>

                <span class="trend-up">
                    +3
                </span>

            </div>

        </div>

        <div class="kpi-card orange">

            <div class="kpi-title">
                本日取込
            </div>

            <div class="kpi-value">
                18
            </div>

            <div class="kpi-footer">

                <span>
                    Outlook / Upload
                </span>

                <span>
                    13 / 5
                </span>

            </div>

        </div>

        <div class="kpi-card red">

            <div class="kpi-title">
                重複候補
            </div>

            <div class="kpi-value">
                4
            </div>

            <div class="kpi-footer">

                <span>
                    要確認
                </span>

                <span class="trend-down">
                    4件
                </span>

            </div>

        </div>

    </div>

    <div class="section">

        <h2>
            アラート
        </h2>

        <div class="alert-high">

            ⚠ 重複候補者が4件検出されています

        </div>

        <div class="alert">

            匿名化品質スコア95%未満の
            求職者が2件存在します

        </div>

    </div>

    <div class="section">

        <h2>
            本日の処理状況
        </h2>

        <table>

            <thead>

                <tr>

                    <th>項目</th>

                    <th>件数</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>
                        Outlook自動取込
                    </td>

                    <td>
                        13
                    </td>

                </tr>

                <tr>

                    <td>
                        手動アップロード
                    </td>

                    <td>
                        5
                    </td>

                </tr>

                <tr>

                    <td>
                        匿名化完了
                    </td>

                    <td>
                        17
                    </td>

                </tr>

                <tr>

                    <td>
                        匿名化エラー
                    </td>

                    <td>
                        1
                    </td>

                </tr>

                <tr>

                    <td>
                        DB登録完了
                    </td>

                    <td>
                        16
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
